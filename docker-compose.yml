services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./temp_uploads:/app/temp_uploads
    environment:
      - PORT=8000
      - PYTHONPATH=/app

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
